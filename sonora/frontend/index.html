<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>Sonora</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Sonora</span>
      </div>
      <nav class="nav">
        <a href="#/home" data-route="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
        <a href="#/add" data-route="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Añadir URL</span></a>
        <a href="#/library" data-route="library"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span>Biblioteca</span></a>
        <a href="#/history" data-route="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg><span>Historial</span></a>
        <a href="#/playlists" data-route="playlists"><svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h8M18 14v7M21 17.5h-6"/></svg><span>Playlists</span></a>
      </nav>
      <div class="sidebar-playlists" id="sidebarPlaylists"></div>
      <div class="net-status" id="netStatus"></div>
    </aside>

    <main class="main" id="view"></main>

    <aside class="queue-panel" id="queuePanel" hidden>
      <header><h3>Cola de reproducción</h3><button class="icon-btn" id="queueClose" title="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
      <ol id="queueList"></ol>
    </aside>
  </div>

  <footer class="player" id="player">
    <div class="now">
      <div class="cover" id="pCover"></div>
      <div class="meta">
        <div class="title" id="pTitle">Nada sonando</div>
        <div class="artist" id="pArtist">Elige una canción</div>
      </div>
    </div>
    <div class="controls">
      <div class="buttons">
        <button class="icon-btn toggle" id="btnShuffle" title="Aleatorio"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="icon-btn" id="btnPrev" title="Anterior"><svg viewBox="0 0 24 24" class="fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play-btn" id="btnPlay" title="Reproducir"><svg viewBox="0 0 24 24" class="fill" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="icon-btn" id="btnNext" title="Siguiente"><svg viewBox="0 0 24 24" class="fill"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="icon-btn toggle" id="btnRepeat" title="Bucle"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg><span class="badge" id="repeatOne">1</span></button>
      </div>
      <div class="progress">
        <span id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1">
        <span id="tDur">0:00</span>
      </div>
    </div>
    <div class="extras">
      <button class="icon-btn" id="btnQueue" title="Cola"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg></button>
      <button class="icon-btn" id="btnMute" title="Silenciar"><svg viewBox="0 0 24 24" id="volIcon"><path d="M11 5 6 9H3v6h3l5 4z" class="fill"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
    </div>
    <audio id="audio" preload="metadata"></audio>
  </footer>

  <div class="toast" id="toast"></div>
  <div class="menu" id="menu" hidden></div>

  <script src="native.js"></script>
  <script src="app.js"></script>
</body>
</html>
